<!DOCTYPE html>

<html class="light" lang="bn"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#002116",
              "inverse-surface": "#293040",
              "surface-container-highest": "#dce2f7",
              "error-container": "#ffdad6",
              "surface-container-high": "#e1e8fd",
              "on-secondary": "#ffffff",
              "tertiary-fixed-dim": "#ffb77d",
              "primary-fixed": "#85f8c4",
              "tertiary-container": "#b15f00",
              "secondary": "#1b6b51",
              "secondary-fixed-dim": "#8bd6b6",
              "surface-variant": "#dce2f7",
              "on-tertiary-container": "#fffbff",
              "primary": "#006948",
              "on-tertiary-fixed-variant": "#6e3900",
              "inverse-on-surface": "#edf0ff",
              "surface": "#f9f9ff",
              "on-primary-fixed-variant": "#005137",
              "surface-tint": "#006c4a",
              "surface-container-lowest": "#ffffff",
              "background": "#f9f9ff",
              "on-surface": "#141b2b",
              "on-primary-fixed": "#002114",
              "on-primary-container": "#f5fff7",
              "on-tertiary": "#ffffff",
              "surface-bright": "#f9f9ff",
              "on-surface-variant": "#3d4a42",
              "secondary-container": "#a6f2d1",
              "outline": "#6d7a72",
              "surface-dim": "#d3daef",
              "primary-fixed-dim": "#68dba9",
              "on-error": "#ffffff",
              "on-primary": "#ffffff",
              "outline-variant": "#bccac0",
              "surface-container": "#e9edff",
              "on-secondary-container": "#237157",
              "error": "#ba1a1a",
              "on-background": "#141b2b",
              "primary-container": "#00855d",
              "on-error-container": "#93000a",
              "tertiary-fixed": "#ffdcc3",
              "surface-container-low": "#f1f3ff",
              "tertiary": "#8d4b00",
              "inverse-primary": "#68dba9",
              "on-tertiary-fixed": "#2f1500",
              "secondary-fixed": "#a6f2d1",
              "on-secondary-fixed-variant": "#00513b"
            },
            fontFamily: {
              "plus-jakarta-sans": ["Plus Jakarta Sans", "sans-serif"],
              "hind-siliguri": ["Hind Siliguri", "sans-serif"],
              "dm-mono": ["DM Mono", "monospace"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .font-hind-siliguri { line-height: 1.6; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-plus-jakarta-sans antialiased">
<!-- TopAppBar -->
<header class="bg-emerald-600 dark:bg-emerald-900 text-white fixed top-0 w-full z-50 shadow-sm dark:shadow-none flex justify-between items-center h-16 px-4 w-full">
<div class="flex items-center gap-3">
<button class="p-2 hover:bg-emerald-700/50 rounded-full active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-hind-siliguri font-bold text-lg">PIN সেট করুন</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-emerald-700/50 rounded-full active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</div>
</header>
<main class="pt-20 pb-12 min-h-screen flex flex-col items-center px-4 max-w-md mx-auto">
<!-- Header Section -->
<div class="text-center mt-6 mb-8">
<p class="font-hind-siliguri text-on-surface-variant font-medium">প্রতিদিন দ্রুত লগইনের জন্য</p>
</div>
<!-- Toggle Switch (4-digit vs 6-digit) -->
<div class="bg-surface-container-low p-1 rounded-full flex gap-1 mb-10 w-fit">
<button class="bg-primary-container text-white px-6 py-2 rounded-full font-plus-jakarta-sans text-sm font-bold transition-all shadow-sm">4-digit</button>
<button class="text-on-surface-variant px-6 py-2 rounded-full font-plus-jakarta-sans text-sm font-medium hover:bg-surface-container-highest transition-all">6-digit</button>
</div>
<!-- PIN Dots Display -->
<div class="flex justify-center gap-6 mb-12">
<!-- Active Dot -->
<div class="w-4 h-4 rounded-full bg-primary ring-4 ring-primary-fixed"></div>
<!-- Inactive Dots -->
<div class="w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant/20"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant/20"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-highest border border-outline-variant/20"></div>
</div>
<!-- Biometric Prompt -->
<div class="bg-surface-container-low/50 border border-outline-variant/10 w-full rounded-2xl p-4 flex items-center justify-between mb-8">
<div class="flex items-center gap-3">
<div class="bg-secondary-container p-2 rounded-xl text-secondary">
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
</div>
<span class="font-hind-siliguri text-sm font-semibold">ফিঙ্গারপ্রিন্ট দিয়ে লগইন চালু করুন</span>
</div>
<!-- Switch UI -->
<div class="w-12 h-6 bg-primary-container rounded-full relative flex items-center px-1">
<div class="w-4 h-4 bg-white rounded-full ml-auto"></div>
</div>
</div>
<!-- Numeric Keypad (Bento/Glass approach) -->
<div class="w-full bg-surface-container-low rounded-3xl p-6 backdrop-blur-xl mb-8">
<div class="grid grid-cols-3 gap-4">
<!-- Numbers 1-9 -->
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">1</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">2</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">3</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">4</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">5</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">6</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">7</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">8</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">9</span>
</button>
<!-- Keypad Footer -->
<div class="h-16 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="fiber_manual_record">fiber_manual_record</span>
</div>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-primary-fixed transition-colors active:scale-95">
<span class="font-dm-mono text-2xl font-bold">0</span>
</button>
<button class="h-16 flex items-center justify-center bg-surface-container-lowest rounded-2xl shadow-sm hover:bg-error-container text-error transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
</div>
<!-- Bottom Actions -->
<div class="mt-auto w-full text-center">
<button class="font-hind-siliguri text-outline font-medium hover:text-on-surface transition-colors py-2">এখনের জন্য বাদ দিন</button>
<div class="mt-6">
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-white rounded-full font-hind-siliguri font-bold text-lg shadow-lg active:scale-[0.98] transition-transform">
                    নিশ্চিত করুন
                </button>
</div>
</div>
</main>
<!-- Contextual Illustration (Glassmorphism card) -->
<div class="fixed top-24 -right-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[12rem]" data-icon="lock_open">lock_open</span>
</div>
</body></html>
