packages:
  - "apps/mobile"
  - "apps/admin"
  - "packages/*"
allowBuilds:
  # unrs-resolver: transitive dep of Expo's own eslint-config-expo (fast
  # TS-aware module resolution for ESLint). Official Expo tooling, approved.
  # esbuild: drizzle-kit's bundler, used to read db/schema.ts when generating
  # migrations. Dev-only tooling, never shipped in the app. Approved.
  # sharp: transitive dep of Next.js, used only by next/image optimization.
  # apps/admin renders no images, so its native build is deliberately skipped
  # rather than left as an undeclared ignored build.
  esbuild: true
  sharp: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.15 || 57.0.17'
  - '@expo/config-plugins@57.0.8'
  - '@expo/metro-runtime@57.0.10 || 57.0.12'
  - '@expo/prebuild-config@57.0.12 || 57.0.13'
  - '@expo/router-server@57.0.6 || 57.0.7'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11 || 57.0.13
  - expo-constants@57.0.11 || 57.0.13
  - expo-file-system@57.0.3 || 57.0.5
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11 || 57.0.12
  - expo-server@57.0.3
  - expo@57.0.13 || 57.0.15
  - '@expo/ui@57.0.11 || 57.0.12'
  - expo-background-task@57.0.10 || 57.0.12
  - expo-dev-client@57.0.12 || 57.0.14
  - expo-dev-launcher@57.0.12 || 57.0.14
  - expo-dev-menu@57.0.12 || 57.0.14
  - expo-image@57.0.3
  - expo-linking@57.0.6 || 57.0.7
  - expo-notifications@57.0.11 || 57.0.13
  - expo-router@57.0.13 || 57.0.15
  - expo-task-manager@57.0.10 || 57.0.12
  - '@expo/fingerprint@0.20.9'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.9'
  - expo-modules-jsi@57.0.5
  - expo-camera@57.0.4

# Deliberately not a wildcard on "apps/*": apps/prototype-web ships its own
# independent pnpm-workspace.yaml/package.json (Vite + React 18 + Tailwind v4)
# and must never be folded into this workspace's install.
